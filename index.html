    // バリエーションバッジ判定
    function getVariantBadge(name) {
      if (name === 'FREE') return { label: 'FREE', bg: '#EAFF3D', text: '#111827' };
      if (name.includes('レプリカ')) return { label: 'REP', bg: '#F8FAFC', text: '#0F172A' };

      if (SHICHIRIN_SUFFIXES.some((s) => name.endsWith(s))) return { label: 'シチリン', bg: '#F59E0B', text: '#111827' };
      if (name.includes('コラボ')) return { label: '★コラボ', bg: '#F43F5E', text: '#FFFFFF' };
      if (name.includes('デコ')) return { label: 'Deco', bg: '#EC4899', text: '#FFFFFF' };
      if (name.includes('ネオ')) return { label: 'NEO', bg: '#3B82F6', text: '#FFFFFF' };
      if (name.includes('カスタム')) return { label: 'Custom', bg: '#F97316', text: '#FFFFFF' };
      if (name.includes('ヒュー')) return { label: 'Hue', bg: '#A855F7', text: '#FFFFFF' };
      if (name.includes('ソレーラ')) return { label: 'Sol', bg: '#EAB308', text: '#111827' };
      if (name.includes('フォイル') || name.includes('テスラ')) return { label: 'Foil', bg: '#06B6D4', text: '#111827' };

    // ==========================================
    // 3. ユーティリティ関数
    // ==========================================
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function evaluateBoard(checkedFlat, size) {
      const lines = [];
      for (let r = 0; r < size; r++) {
        const row = [];
        for (let c = 0; c < size; c++) row.push(r * size + c);
        lines.push(row);
      }
      for (let c = 0; c < size; c++) {
        const col = [];
        for (let r = 0; r < size; r++) col.push(r * size + c);
        lines.push(col);
      }
      const d1 = [], d2 = [];
      for (let i = 0; i < size; i++) {
        d1.push(i * size + i);
        d2.push(i * size + (size - 1 - i));
      }
      lines.push(d1, d2);

      let bingoCount = 0;
      let reachCount = 0;
      const bingoCells = new Set();

      for (const line of lines) {
        const count = line.filter((idx) => checkedFlat[idx]).length;
        if (count === size) {
          bingoCount++;
          line.forEach((idx) => bingoCells.add(idx));
        } else if (count === size - 1) {
          reachCount++;
        }
      }
      return { bingoCount, reachCount, bingoCells };
    }

    function buildBoards({ size, players, freeCenter, allowDuplicate, categories, includeReplica }) {
      const pool = ALL_WEAPONS.filter(
        (w) => categories.includes(w.category) && (includeReplica || !w.isReplica)
      ).map((w) => w.name);

      const useFree = freeCenter && size % 2 === 1;
      const neededPerBoard = size * size - (useFree ? 1 : 0);

      if (pool.length < neededPerBoard) {
        throw new Error(`選択中の武器数（${pool.length}種）がマス目数（${neededPerBoard}）より少ないです。`);
      }
      if (!allowDuplicate && pool.length < neededPerBoard * players) {
        throw new Error(`被りなしの場合、武器数が足りません（必要: ${neededPerBoard * players}種 / 現在: ${pool.length}種）。「他プレイヤーと被り許可」をONにするか条件を調整してください。`);
      }

      const sharedPool = shuffle(pool);
      let cursor = 0;
      const centerIdx = Math.floor((size * size) / 2);

      const boards = [];
      for (let p = 0; p < players; p++) {
        const selected = allowDuplicate
          ? shuffle(pool).slice(0, neededPerBoard)
          : sharedPool.slice(cursor, (cursor += neededPerBoard));

        const weapons = [];
        const checked = [];
        let sIdx = 0;
        for (let i = 0; i < size * size; i++) {
          if (useFree && i === centerIdx) {
            weapons.push('FREE');
            checked.push(true);
          } else {
            weapons.push(selected[sIdx++]);
            checked.push(false);
          }
        }
        boards.push({
          name: players === 1 ? '全員共有ボード' : `プレイヤー ${p + 1}`,
          weapons,
          checked
        });
      }
      return boards;
    }

    // ==========================================
    // 4. メインアプリケーション
    // ==========================================
    function App() {
      const [authReady, setAuthReady] = useState(false);
      const [authError, setAuthError] = useState('');

      const [tempName, setTempName] = useState('');
      const [toast, setToast] = useState('');
      const [loading, setLoading] = useState(false);

      // 作成フォーム設定
      const [size, setSize] = useState(5);
      const [players, setPlayers] = useState(4);
      const [freeCenter, setFreeCenter] = useState(true);
      const [allowDuplicate, setAllowDuplicate] = useState(true);
      const [includeReplica, setIncludeReplica] = useState(false);
      const [selectedCategories, setSelectedCategories] = useState(WEAPON_CATEGORIES.map((c) => c.id));

      const prevBingoCounts = useRef({});

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      // 匿名認証＆URLパラメータ確認
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        if (urlRoom) {
          setJoinInput(urlRoom.toUpperCase());
        }

        auth.signInAnonymously()
          .then(() => {
            setAuthReady(true);
            if (urlRoom) {
              setRoomCode(urlRoom.toUpperCase());
            }
          })
          .catch((err) => {
            console.error('Firebase Auth Error:', err);
            setAuthError('Firebaseの匿名認証が有効になっていません。Firebase ConsoleのAuthenticationで「匿名」を有効にしてください。');
          });
      }, []);

      // Firestore リアルタイム購読
      useEffect(() => {
        if (!authReady || !roomCode) return;
        const docRef = db.collection('spla3_bingo_rooms').doc(roomCode);
        const unsubscribe = docRef.onSnapshot(
          (doc) => {
            if (doc.exists) {
              const data = doc.data();
              setRoomData(data);

              // 新規ビンゴ達成時の紙吹雪
              data.boards.forEach((b, idx) => {
                const { bingoCount } = evaluateBoard(b.checked, data.size);
                const prev = prevBingoCounts.current[idx];
                if (prev !== undefined && bingoCount > prev) {
                  confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#EAFF3D', '#FF2D8A', '#00E5FF', '#A855F7']
                  });
                  showToast(`🎉 ${b.name} がビンゴ達成！（${bingoCount}ライン）`);
                }
                prevBingoCounts.current[idx] = bingoCount;
              });
            } else {
              showToast('指定されたルームが見つかりません');
              setRoomCode('');
              setRoomData(null);
            }
          },
          (err) => {
            console.error('Firestore Error:', err);
            showToast('通信エラーが発生しました（Firestoreのルールを確認してください）');
          }
        );
        return () => unsubscribe();
      }, [authReady, roomCode]);

      const availableCount = useMemo(() => {
        return ALL_WEAPONS.filter(
          (w) => selectedCategories.includes(w.category) && (includeReplica || !w.isReplica)
        ).length;
      }, [selectedCategories, includeReplica]);

      const toggleCategory = (id) => {
        setSelectedCategories((prev) =>
          prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id]
        );
      };

      // ルーム作成
      const handleCreateRoom = async () => {
        if (!authReady) return showToast('接続準備中です。少しお待ちください。');
        setLoading(true);
        try {
          const boards = buildBoards({
            size,
            players,
            freeCenter,
            allowDuplicate,
            categories: selectedCategories,
            includeReplica
          });
          const code = generateRoomCode();
          const payload = {
            code,
            size,
            players,
            freeCenter,
            allowDuplicate,
            includeReplica,
            categories: selectedCategories,
            boards,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('spla3_bingo_rooms').doc(code).set(payload);
          prevBingoCounts.current = {};
          setActivePlayerIdx(0);
          setRoomCode(code);
          window.history.replaceState(null, '', `?room=${code}`);
          showToast(`ルーム ${code} を作成しました！`);
        } catch (err) {
          showToast(err.message || 'ルーム作成に失敗しました');
        } finally {
          setLoading(false);
        }
      };

      // ルーム参加
      const handleJoinRoom = async () => {
        const code = joinInput.trim().toUpperCase();
        if (code.length < 4) return showToast('ルームコードを入力してください');
        if (!authReady) return showToast('接続準備中です');
        setLoading(true);
        try {
          const snap = await db.collection('spla3_bingo_rooms').doc(code).get();
          if (!snap.exists) {
            showToast('ルームが見つかりませんでした');
          } else {
            prevBingoCounts.current = {};
            setActivePlayerIdx(0);
            setRoomCode(code);
            window.history.replaceState(null, '', `?room=${code}`);
          }
        } catch (err) {
          showToast('参加に失敗しました');
        } finally {
          setLoading(false);
        }
      };

      // マス目チェック切り替え
      const handleToggleCell = async (cellIdx) => {
        if (!roomData) return;
        const newBoards = roomData.boards.map((b, idx) => {
          if (idx !== activePlayerIdx) return b;
          const newChecked = [...b.checked];
          newChecked[cellIdx] = !newChecked[cellIdx];
          return { ...b, checked: newChecked };
        });
        await db.collection('spla3_bingo_rooms').doc(roomCode).update({ boards: newBoards });
      };

      // プレイヤー名変更
      const handleSaveName = async () => {
        if (!tempName.trim() || !roomData) {
          setEditingName(false);
          return;
        }
        const newBoards = roomData.boards.map((b, idx) =>
          idx === activePlayerIdx ? { ...b, name: tempName.trim().slice(0, 16) } : b
        );
        await db.collection('spla3_bingo_rooms').doc(roomCode).update({ boards: newBoards });
        setEditingName(false);
      };

      // 盤面シャッフル（再抽選）
      const handleReshuffle = async () => {
        if (!roomData || !confirm('全員の武器を新しくランダム抽選しますか？（チェックはリセットされます）')) return;
        try {
          const newBoards = buildBoards({
            size: roomData.size,
            players: roomData.players,
            freeCenter: roomData.freeCenter,
            allowDuplicate: roomData.allowDuplicate,
            categories: roomData.categories,
            includeReplica: roomData.includeReplica
          }).map((b, idx) => ({ ...b, name: roomData.boards[idx]?.name || b.name }));
          prevBingoCounts.current = {};
          await db.collection('spla3_bingo_rooms').doc(roomCode).update({ boards: newBoards });
          showToast('武器を再抽選しました！');
        } catch (err) {
          showToast(err.message);
        }
      };

      // チェックのみリセット
      const handleResetChecks = async () => {
        if (!roomData || !confirm('現在のプレイヤーのチェックをすべて外しますか？')) return;
        const centerIdx = Math.floor((roomData.size * roomData.size) / 2);
        const useFree = roomData.freeCenter && roomData.size % 2 === 1;
        const newBoards = roomData.boards.map((b, idx) => {
          if (idx !== activePlayerIdx) return b;
          return {
            ...b,
            checked: b.checked.map((_, i) => (useFree && i === centerIdx))
          };
        });
        await db.collection('spla3_bingo_rooms').doc(roomCode).update({ boards: newBoards });
        showToast('チェックをリセットしました');
      };

      const copyShareUrl = () => {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
        navigator.clipboard.writeText(url);
        showToast('共有URLをコピーしました！Discordに貼ってください');
      };

      const leaveRoom = () => {
        setRoomCode('');
        setRoomData(null);
        window.history.replaceState(null, '', window.location.pathname);
      };

      const currentBoard = roomData?.boards?.[activePlayerIdx];
      const evalResult = currentBoard ? evaluateBoard(currentBoard.checked, roomData.size) : null;

      return (
        <div className="max-w-5xl mx-auto px-3 sm:px-6 py-5">
          {toast && (
            <div className="fixed top-4 right-4 z-50 bg-[#FF2D8A] text-white font-bold px-4 py-3 rounded-xl shadow-2xl border-2 border-white/20 ink-pop">
              {toast}
            </div>
          )}

          <header className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div className="flex items-center gap-3 cursor-pointer" onClick={leaveRoom}>
              <div className="w-11 h-11 rounded-2xl bg-[#EAFF3D] text-[#12131A] flex items-center justify-center text-2xl shadow-lg shadow-[#EAFF3D]/20">
                🦑
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-black tracking-tight">
                  <span className="text-[#EAFF3D]">スプラ3</span>{' '}
                  <span className="text-[#FF2D8A]">全武器ビンゴ</span>
                </h1>
                <p className="text-xs text-gray-400">全{ALL_WEAPONS.length}種対応 / リアルタイム共有ツール</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {authReady ? (
                <span className="text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  オンライン接続済み
                </span>
              ) : (
                <span className="text-xs font-bold px-3 py-1.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                  接続中...
                </span>
              )}
            </div>
          </header>

          {authError && (
            <div className="mb-6 p-4 rounded-xl bg-red-500/20 border border-red-500 text-red-200 text-sm font-bold">
              ⚠️ {authError}
            </div>
          )}

          {!roomData ? (
            <div className="grid md:grid-cols-2 gap-6">
              <div className="bg-[#1A1C26] border border-gray-800 rounded-2xl p-5 sm:p-6 shadow-xl">
                <h2 className="text-lg font-black text-[#EAFF3D] mb-4 flex items-center gap-2">
                  <span>＋</span> 新しいルームを作成
                </h2>

                <div className="mb-4">
                  <label className="block text-xs font-bold text-gray-400 mb-2">マス目サイズ</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[3, 4, 5].map((s) => (
                      <button
                        key={s}
                        onClick={() => setSize(s)}
                        className={`py-2.5 rounded-xl font-black text-sm transition ${
                          size === s
                            ? 'bg-[#EAFF3D] text-[#12131A] shadow-lg shadow-[#EAFF3D]/20'
                            : 'bg-[#12131A] text-gray-300 border border-gray-700 hover:border-gray-500'
                        }`}
                      >
                        {s} × {s}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mb-4">
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-bold text-gray-400">参加人数（1人＝共有 / 2〜8人＝対戦）</label>
                    <span className="text-lg font-black text-[#FF2D8A]">{players} 人</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="8"
                    value={players}
                    onChange={(e) => setPlayers(Number(e.target.value))}
                    className="w-full accent-[#FF2D8A] cursor-pointer"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2 mb-4">
                  <label className="flex items-center gap-2 bg-[#12131A] p-2.5 rounded-xl border border-gray-800 cursor-pointer text-xs font-bold">
                    <input
                      type="checkbox"
                      checked={freeCenter}
                      onChange={(e) => setFreeCenter(e.target.checked)}
                      className="accent-[#00E5FF] w-4 h-4"
                    />
                    中央FREEマス
                  </label>
                  <label className="flex items-center gap-2 bg-[#12131A] p-2.5 rounded-xl border border-gray-800 cursor-pointer text-xs font-bold">
                    <input
                      type="checkbox"
                      checked={allowDuplicate}
                      onChange={(e) => setAllowDuplicate(e.target.checked)}
                      className="accent-[#00E5FF] w-4 h-4"
                    />
                    他プレイヤー被り許可
                  </label>
                  <label className="col-span-2 flex items-center gap-2 bg-[#12131A] p-2.5 rounded-xl border border-gray-800 cursor-pointer text-xs font-bold">
                    <input
                      type="checkbox"
                      checked={includeReplica}
                      onChange={(e) => setIncludeReplica(e.target.checked)}
                      className="accent-[#00E5FF] w-4 h-4"
                    />
                    ヒーロー／オーダーレプリカ武器を含める
                  </label>
                </div>

                <div className="mb-5">
                  <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-bold text-gray-400">
                      登場する武器種（対象: <span className="text-white">{availableCount}種</span>）
                    </label>
                    <button
                      onClick={() =>
                        setSelectedCategories(
                          selectedCategories.length === WEAPON_CATEGORIES.length
                            ? []
                            : WEAPON_CATEGORIES.map((c) => c.id)
                        )
                      }
                      className="text-xs font-bold text-[#00E5FF] hover:underline"
                    >
                      {selectedCategories.length === WEAPON_CATEGORIES.length ? '全解除' : '全選択'}
                    </button>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {WEAPON_CATEGORIES.map((cat) => {
                      const active = selectedCategories.includes(cat.id);
                      return (
                        <button
                          key={cat.id}
                          onClick={() => toggleCategory(cat.id)}
                          style={active ? { backgroundColor: cat.color, color: cat.text } : {}}
                          className={`px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${
                            active ? 'shadow-sm' : 'bg-[#12131A] text-gray-500 border border-gray-800'
                          }`}
                        >
                          {cat.name}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button
                  onClick={handleCreateRoom}
                  disabled={loading || !authReady}
                  className="w-full py-3.5 rounded-xl font-black text-base bg-gradient-to-r from-[#EAFF3D] to-[#F97316] text-[#12131A] shadow-lg hover:brightness-110 active:scale-[0.99] transition disabled:opacity-50"
                >
                  {loading ? '作成中...' : 'ビンゴルームを作成する 🚀'}
                </button>
              </div>

              <div className="bg-[#1A1C26] border border-gray-800 rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col justify-between">
                <div>
                  <h2 className="text-lg font-black text-[#00E5FF] mb-2 flex items-center gap-2">
                    <span>➜</span> 作成済みのルームに参加
                  </h2>
                  <p className="text-xs text-gray-400 mb-5 leading-relaxed">
                    Discord等で共有された6桁のルームコードを入力して、進行中のビンゴに参加できます。
                  </p>
                  <label className="block text-xs font-bold text-gray-400 mb-2">ルームコード（6桁）</label>
                  <input
                    type="text"
                    maxLength={6}
                    value={joinInput}
                    onChange={(e) => setJoinInput(e.target.value.toUpperCase())}
                    placeholder="例: ABC123"
                    className="w-full bg-[#12131A] border-2 border-gray-700 focus:border-[#00E5FF] rounded-xl py-4 text-center text-2xl font-black tracking-[0.25em] text-[#EAFF3D] outline-none mb-6"
                  />
                </div>
                <button
                  onClick={handleJoinRoom}
                  disabled={loading || !authReady}
                  className="w-full py-3.5 rounded-xl font-black text-base bg-[#00E5FF] text-[#12131A] shadow-lg hover:brightness-110 active:scale-[0.99] transition disabled:opacity-50"
                >
                  ルームに参加する 🎮
                </button>
              </div>
            </div>
          ) : (
            <div className="space-y-5">
              <div className="bg-[#1A1C26] border border-gray-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div>
                    <span className="text-[11px] font-bold text-gray-400 block">ROOM CODE</span>
                    <span className="text-2xl font-black tracking-widest text-[#EAFF3D]">{roomCode}</span>
                  </div>
                  <button
                    onClick={copyShareUrl}
                    className="px-3.5 py-2 rounded-xl bg-[#00E5FF]/15 text-[#00E5FF] border border-[#00E5FF]/40 text-xs font-black hover:bg-[#00E5FF]/25 transition"
                  >
                    📋 共有URLをコピー
                  </button>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={handleReshuffle}
                    className="px-3 py-2 rounded-xl bg-[#12131A] border border-gray-700 hover:border-[#EAFF3D] text-xs font-bold transition"
                  >
                    🔀 武器を再抽選
                  </button>
                  <button
                    onClick={handleResetChecks}
                    className="px-3 py-2 rounded-xl bg-[#12131A] border border-gray-700 hover:border-[#FF2D8A] text-xs font-bold transition"
                  >
                    ↺ チェックリセット
                  </button>
                  <button
                    onClick={leaveRoom}
                    className="px-3 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-bold text-gray-300 transition"
                  >
                    退出
                  </button>
                </div>
              </div>

              {roomData.boards.length > 1 && (
                <div className="flex gap-2 overflow-x-auto pb-1">
                  {roomData.boards.map((b, idx) => {
                    const stats = evaluateBoard(b.checked, roomData.size);
                    const active = idx === activePlayerIdx;
                    return (
                      <button
                        key={idx}
                        onClick={() => {
                          setActivePlayerIdx(idx);
                          setEditingName(false);
                        }}
                        className={`shrink-0 px-4 py-2.5 rounded-xl font-bold text-xs border transition flex items-center gap-2 ${
                          active
                            ? 'bg-[#FF2D8A] text-white border-[#FF2D8A] shadow-lg shadow-[#FF2D8A]/25'
                            : 'bg-[#1A1C26] text-gray-300 border-gray-800 hover:border-gray-600'
                        }`}
                      >
                        <span>{b.name}</span>
                        <span className={`px-1.5 py-0.5 rounded text-[10px] font-black ${active ? 'bg-black/25' : 'bg-black/40 text-[#EAFF3D]'}`}>
                          {stats.bingoCount > 0 ? `🎉${stats.bingoCount}B` : `${b.checked.filter(Boolean).length}/${roomData.size * roomData.size}`}
                        </span>
                      </button>
                    );
                  })}
                </div>
              )}

              {currentBoard && evalResult && (
                <div className="bg-[#1A1C26] border border-gray-800 rounded-2xl p-4 sm:p-5">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div className="flex items-center gap-2">
                      {editingName ? (
                        <div className="flex items-center gap-1.5">
                          <input
                            type="text"
                            value={tempName}
                            onChange={(e) => setTempName(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleSaveName()}
                            className="bg-[#12131A] border border-[#00E5FF] rounded-lg px-2.5 py-1 text-sm font-bold text-white outline-none"
                            autoFocus
                          />
                          <button onClick={handleSaveName} className="px-2.5 py-1 rounded-lg bg-[#00E5FF] text-[#12131A] text-xs font-black">
                            保存
                          </button>
                        </div>
                      ) : (
                        <>
                          <h2 className="text-lg sm:text-xl font-black text-white">{currentBoard.name}</h2>
                          <button
                            onClick={() => {
                              setTempName(currentBoard.name);
                              setEditingName(true);
                            }}
                            className="text-xs text-gray-400 hover:text-[#00E5FF]"
                            title="名前を編集"
                          >
                            ✏️
                          </button>
                        </>
                      )}
                    </div>

                    <div className="flex items-center gap-3 text-xs sm:text-sm font-black">
                      <span className="px-3 py-1 rounded-lg bg-[#12131A] text-gray-300">
                        達成: <span className="text-white">{currentBoard.checked.filter(Boolean).length}/{roomData.size * roomData.size}</span>
                      </span>
                      <span className="px-3 py-1 rounded-lg bg-[#12131A] text-[#00E5FF]">
                        リーチ: {evalResult.reachCount}
                      </span>
                      <span className={`px-3 py-1 rounded-lg ${evalResult.bingoCount > 0 ? 'bg-[#EAFF3D] text-[#12131A]' : 'bg-[#12131A] text-gray-400'}`}>
                        BINGO: {evalResult.bingoCount}
                      </span>
                    </div>
                  </div>

                  <div
                    className="grid gap-1.5 sm:gap-2.5"
                    style={{ gridTemplateColumns: `repeat(${roomData.size}, minmax(0, 1fr))` }}
                  >
                    {currentBoard.weapons.map((weaponName, idx) => {
                      const isChecked = currentBoard.checked[idx];
                      const isBingoCell = evalResult.bingoCells.has(idx);
                      const info = WEAPON_MAP[weaponName];
                      const catObj = WEAPON_CATEGORIES.find((c) => c.id === info?.category);
                      const badge = getVariantBadge(weaponName);

                      return (
                        <button
                          key={idx}
                          onClick={() => handleToggleCell(idx)}
                          className={`relative aspect-square rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-between text-center border-2 transition-all select-none overflow-hidden ${
                            isChecked
                              ? 'bg-gradient-to-br from-[#FF2D8A]/90 to-[#A855F7]/90 border-[#FF2D8A] text-white ink-pop'
                              : 'bg-[#12131A] border-gray-800 hover:border-gray-600 text-gray-200'
                          } ${isBingoCell ? 'bingo-glow' : ''}`}
                        >
                          <div className="w-full flex justify-between items-start">
                            {badge ? (
                              <span
                                style={{ backgroundColor: badge.bg, color: badge.text }}
                                className="text-[8px] sm:text-[10px] font-black px-1.5 py-0.5 rounded leading-none"
                              >
                                {badge.label}
                              </span>
                            ) : (
                              <span />
                            )}
                            {isChecked && (
                              <span className="text-[11px] sm:text-sm leading-none">✅</span>
                            )}
                          </div>

                          <div className="my-auto">
                            <WeaponIcon
                              category={info?.category}
                              isScope={info?.isScope}
                              color={isChecked ? '#EAFF3D' : (catObj?.color || '#EAFF3D')}
                              className={roomData.size === 5 ? 'w-6 h-6 sm:w-9 sm:h-9' : 'w-8 h-8 sm:w-11 sm:h-11'}
                            />
                          </div>

                          <div
                            className={`w-full font-extrabold leading-tight break-words line-clamp-2 ${
                              roomData.size === 5
                                ? 'text-[9px] sm:text-xs'
                                : 'text-[10px] sm:text-sm'
                            }`}
                          >
                            {weaponName}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          <footer className="mt-8 text-center text-[11px] text-gray-500">
            Splatoon 3 Random Weapon Bingo App - Realtime Sync Edition
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
